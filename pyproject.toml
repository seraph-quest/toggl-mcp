[project]
name = "toggl-mcp"
version = "0.1.0"
description = "Toggl Track MCP server for Seraph and Claude Desktop"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9.0",
    "httpx>=0.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
